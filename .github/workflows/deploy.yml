name: Deploy Frontend

on:
  push:
    branches: [deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_VENTAS_URL=http://10.0.132.241:8080 \
            --build-arg VITE_API_DESPACHOS_URL=http://10.0.132.241:8081 \
            -t danibetancourt/front-despacho:${{ env.IMAGE_TAG }} .
          docker push danibetancourt/front-despacho:${{ env.IMAGE_TAG }}

      - name: Deploy to EC2 via SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_FRONTEND_ID }}
          DOCKER_PWD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_USR: ${{ secrets.DOCKER_USERNAME }}
        run: |
          IMAGE="danibetancourt/front-despacho"
          TAG="${IMAGE_TAG}"
          COMMAND="#!/bin/bash
          set -e
          echo \"${DOCKER_PWD}\" | docker login -u \"${DOCKER_USR}\" --password-stdin
          docker pull ${IMAGE}:${TAG}
          docker stop frontend 2>/dev/null || true
          docker rm frontend 2>/dev/null || true
          docker run -d --name frontend -p 80:80 ${IMAGE}:${TAG}"
          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "commands=$COMMAND" \
            --query Command.CommandId \
            --output text
